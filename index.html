<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CONTROL STOCK</title>

<link rel="icon" href="./icone.png">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

body{
background:#020617;
color:#e2e8f0;
overflow-x:hidden;
}

.layout{
display:flex;
min-height:100vh;
}

/* SIDEBAR */

.sidebar{
width:260px;
background:rgba(15,23,42,0.95);
border-right:1px solid rgba(255,255,255,0.05);
padding:25px;
position:fixed;
height:100%;
backdrop-filter:blur(10px);
}

.logo{
margin-bottom:40px;
}

.logo h1{
font-size:28px;
font-weight:900;
background:linear-gradient(90deg,#38bdf8,#2563eb);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.logo p{
margin-top:8px;
color:#94a3b8;
font-size:14px;
}

.menu{
display:flex;
flex-direction:column;
gap:14px;
}

.menu button{
background:#111827;
border:none;
padding:16px;
border-radius:16px;
color:#cbd5e1;
font-size:15px;
font-weight:700;
cursor:pointer;
transition:0.3s;
display:flex;
align-items:center;
gap:12px;
}

.menu button:hover{
background:#1e293b;
transform:translateX(4px);
box-shadow:0 0 20px rgba(59,130,246,0.25);
}

/* CONTEÚDO */

.main{
margin-left:260px;
padding:30px;
width:100%;
}

.topo{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:30px;
}

.topo h2{
font-size:30px;
font-weight:800;
}

.topo span{
color:#38bdf8;
}

.status-online{
background:#111827;
padding:14px 20px;
border-radius:16px;
border:1px solid rgba(255,255,255,0.05);
font-weight:700;
color:#4ade80;
}

/* DASHBOARD */

.dashboard{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:18px;
margin-bottom:30px;
}

.card-info{
background:rgba(15,23,42,0.8);
border:1px solid rgba(255,255,255,0.05);
padding:24px;
border-radius:24px;
backdrop-filter:blur(10px);
transition:0.3s;
position:relative;
overflow:hidden;
}

.card-info::before{
content:'';
position:absolute;
width:120px;
height:120px;
background:rgba(59,130,246,0.12);
border-radius:50%;
top:-40px;
right:-40px;
}

.card-info:hover{
transform:translateY(-4px);
box-shadow:0 0 25px rgba(59,130,246,0.2);
}

.card-info h3{
font-size:14px;
color:#94a3b8;
margin-bottom:10px;
}

.card-info span{
font-size:34px;
font-weight:900;
color:#38bdf8;
}

/* FORM */

.card{
background:rgba(15,23,42,0.8);
padding:28px;
border-radius:24px;
border:1px solid rgba(255,255,255,0.05);
margin-bottom:30px;
}

.card h2{
margin-bottom:22px;
font-size:22px;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:14px;
}

input{
background:#0f172a;
border:1px solid rgba(255,255,255,0.05);
padding:16px;
border-radius:16px;
color:white;
font-size:15px;
transition:0.2s;
}

input::placeholder{
color:#64748b;
}

input:focus{
outline:none;
border-color:#2563eb;
box-shadow:0 0 0 4px rgba(37,99,235,0.2);
}

button{
border:none;
cursor:pointer;
transition:0.2s;
}

.btn{
background:linear-gradient(90deg,#2563eb,#06b6d4);
padding:16px;
border-radius:16px;
color:white;
font-weight:800;
font-size:15px;
}

.btn:hover{
transform:scale(1.03);
box-shadow:0 0 20px rgba(59,130,246,0.35);
}

/* PESQUISA */

.pesquisa{
margin-bottom:20px;
position:relative;
}

.pesquisa i{
position:absolute;
left:18px;
top:18px;
color:#64748b;
}

.pesquisa input{
width:100%;
padding-left:50px;
}

/* TABELA */

.table-container{
overflow-x:auto;
border-radius:24px;
}

table{
width:100%;
border-collapse:collapse;
background:rgba(15,23,42,0.85);
backdrop-filter:blur(10px);
border-radius:24px;
overflow:hidden;
}

th{
background:#111827;
padding:18px;
text-align:left;
font-size:14px;
color:#cbd5e1;
}

td{
padding:18px;
border-bottom:1px solid rgba(255,255,255,0.05);
}

tr{
transition:0.2s;
}

tr:hover{
background:rgba(255,255,255,0.03);
}

.alerta{
background:rgba(127,29,29,0.2);
}

.status-ok{
background:rgba(22,163,74,0.2);
color:#4ade80;
padding:8px 12px;
border-radius:999px;
font-size:13px;
font-weight:700;
}

.status-alerta{
background:rgba(220,38,38,0.2);
color:#f87171;
padding:8px 12px;
border-radius:999px;
font-size:13px;
font-weight:700;
}

.acoes{
display:flex;
gap:10px;
}

.entrada{
background:#16a34a;
color:white;
padding:12px 14px;
border-radius:12px;
font-weight:900;
}

.saida{
background:#dc2626;
color:white;
padding:12px 14px;
border-radius:12px;
font-weight:900;
}

/* GRÁFICO */

.grafico{
margin-top:30px;
background:rgba(15,23,42,0.8);
padding:25px;
border-radius:24px;
border:1px solid rgba(255,255,255,0.05);
}

/* TOAST */

.toast{
position:fixed;
top:20px;
right:20px;
background:#111827;
padding:16px 22px;
border-radius:14px;
border-left:5px solid #38bdf8;
font-weight:700;
box-shadow:0 0 20px rgba(0,0,0,0.3);
animation:fade 0.3s;
z-index:999;
}

@keyframes fade{
from{
opacity:0;
transform:translateY(-10px);
}
to{
opacity:1;
transform:translateY(0);
}
}

@media(max-width:900px){

.sidebar{
display:none;
}

.main{
margin-left:0;
}

}

</style>

</head>

<body>

<div class="layout">

<div class="sidebar">

<div class="logo">
<h1>⚡ CONTROLE DE ESTOQUE</h1>
<p>Cyber Stock System</p>
</div>

<div class="menu">

<button>
<i class="fa-solid fa-chart-line"></i>
Dashboard
</button>

<button>
<i class="fa-solid fa-box"></i>
Estoque
</button>

<button>
<i class="fa-solid fa-triangle-exclamation"></i>
Alertas
</button>

<button>
<i class="fa-solid fa-clock-rotate-left"></i>
Histórico
</button>

<button>
<i class="fa-solid fa-gear"></i>
Configurações
</button>

</div>

</div>

<div class="main">

<div class="topo">

<div>
<h2>⚡ Controle de <span>Estoque</span></h2>
</div>

<div class="status-online">
🟢 Sistema Online
</div>

</div>

<div class="dashboard">

<div class="card-info">
<h3>Total de Itens</h3>
<span id="totalItens">0</span>
</div>

<div class="card-info">
<h3>Itens em Alerta</h3>
<span id="itensAlerta">0</span>
</div>

<div class="card-info">
<h3>Total Estoque</h3>
<span id="estoqueTotal">0</span>
</div>

<div class="card-info">
<h3>Status</h3>
<span style="font-size:22px;color:#4ade80;">
ONLINE
</span>
</div>

</div>

<div class="card">

<h2>📦 Novo Item</h2>

<div class="grid">

<input id="item" placeholder="Nome do item">

<input
id="quantidade"
type="number"
placeholder="Quantidade">

<input
id="minimo"
type="number"
placeholder="Estoque mínimo">

<button class="btn" onclick="cadastrar()">
Cadastrar
</button>

</div>

</div>

<div class="pesquisa">

<i class="fa-solid fa-magnifying-glass"></i>

<input
type="text"
id="pesquisa"
placeholder="Pesquisar item..."
onkeyup="filtrarTabela()">

</div>

<div class="table-container">

<table>

<thead>

<tr>
<th>Item</th>
<th>Quantidade</th>
<th>Mínimo</th>
<th>Status</th>
<th>Ações</th>
</tr>

</thead>

<tbody id="tabela"></tbody>

</table>

</div>

<div class="grafico">

<h2 style="margin-bottom:20px;">
📊 Visão Estoque
</h2>

<canvas id="graficoEstoque"></canvas>

</div>

</div>

</div>

<script>

const API_URL = "https://script.google.com/macros/s/AKfycbwDfc6az14wh1YF2qNmZW6NanRET487an62jUUctJgHd-OVoPRrbYhHL3TTaGn2TcLN/exec";

let grafico;

function toast(mensagem){

const div = document.createElement("div");

div.className = "toast";

div.innerText = mensagem;

document.body.appendChild(div);

setTimeout(()=>{

div.remove();

},3000);

}

async function carregar(){

const resposta = await fetch(API_URL);

const dados = await resposta.json();

const tabela = document.getElementById("tabela");

tabela.innerHTML = "";

let totalItens = dados.length;

let itensAlerta = 0;

let totalEstoque = 0;

const nomes = [];

const quantidades = [];

dados.forEach(item=>{

const alerta =
Number(item.quantidade)
<=
Number(item.minimo);

if(alerta){
itensAlerta++;
}

totalEstoque += Number(item.quantidade);

nomes.push(item.item);

quantidades.push(item.quantidade);

tabela.innerHTML += `

<tr class="${alerta ? 'alerta' : ''}">

<td>${item.item}</td>

<td>${item.quantidade}</td>

<td>${item.minimo}</td>

<td>

<span class="${
alerta
?
'status-alerta'
:
'status-ok'
}">

${alerta ? 'ALERTA' : 'OK'}

</span>

</td>

<td>

<div class="acoes">

<button
class="entrada"
onclick="movimentar('${item.item}','entrada')">

+

</button>

<button
class="saida"
onclick="movimentar('${item.item}','saida')">

-

</button>

</div>

</td>

</tr>

`;

});

document.getElementById("totalItens").innerText = totalItens;

document.getElementById("itensAlerta").innerText = itensAlerta;

document.getElementById("estoqueTotal").innerText = totalEstoque;

gerarGrafico(nomes,quantidades);

}

function gerarGrafico(labels,data){

const ctx =
document.getElementById("graficoEstoque");

if(grafico){
grafico.destroy();
}

grafico = new Chart(ctx,{

type:'bar',

data:{

labels:labels,

datasets:[{

label:'Quantidade',

data:data,

borderWidth:1

}]

},

options:{

responsive:true,

plugins:{
legend:{
labels:{
color:'white'
}
}
},

scales:{

x:{
ticks:{
color:'white'
}
},

y:{
ticks:{
color:'white'
}
}

}

}

});

}

async function cadastrar(){

const item =
document.getElementById("item").value;

const quantidade =
document.getElementById("quantidade").value;

const minimo =
document.getElementById("minimo").value;

if(!item || !quantidade || !minimo){

toast("Preencha todos os campos");

return;

}

const resposta = await fetch(API_URL,{

method:"POST",

body:JSON.stringify({

tipo:"cadastro",
item,
quantidade,
minimo

})

});

const texto = await resposta.text();

if(texto === "ITEM_JA_EXISTE"){

toast("Esse item já existe");

return;

}

toast("Item cadastrado");

document.getElementById("item").value = "";

document.getElementById("quantidade").value = "";

document.getElementById("minimo").value = "";

carregar();

}

async function movimentar(item,acao){

const quantidade =
prompt("Digite a quantidade:");

if(!quantidade) return;

const resposta = await fetch(API_URL,{

method:"POST",

body:JSON.stringify({

tipo:"movimentacao",
item,
acao,
quantidade

})

});

const texto = await resposta.text();

if(texto === "ESTOQUE_INSUFICIENTE"){

toast("Estoque insuficiente");

return;

}

toast("Movimentação realizada");

carregar();

}

function filtrarTabela(){

const filtro =
document.getElementById("pesquisa")
.value
.toLowerCase();

const linhas =
document.querySelectorAll("#tabela tr");

linhas.forEach(linha=>{

const texto =
linha.innerText.toLowerCase();

linha.style.display =
texto.includes(filtro)
?
""
:
"none";

});

}

carregar();

</script>

</body>
</html>
