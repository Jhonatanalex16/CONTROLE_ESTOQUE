<body>
<div class="layout">
<div class="sidebar">
<div class="logo">
<h1> IF CYBER</h1>
<p>Cyber Stock System</p>
</div>
<div class="menu">
<button onclick="mostrarSecao('dashboard')" class="menu-btn active">
<i class="fa-solid fa-chart-line"></i>
Dashboard
</button>
<button onclick="mostrarSecao('estoque')" class="menu-btn">
<i class="fa-solid fa-box"></i>
8
Estoque
</button>
<button onclick="mostrarSecao('alertas')" class="menu-btn">
<i class="fa-solid fa-triangle-exclamation"></i>
Alertas
</button>
</div>
</div>
<div class="main">
<div class="topo">
<h2> Controle de Estoque</h2>
</div>
<div id="dashboard" class="secao ativa">
<div class="dashboard">
<div class="card-info">
<h3>Total Itens</h3>
<span id="totalItens">0</span>
</div>
<div class="card-info">
<h3>Itens Alerta</h3>
<span id="itensAlerta">0</span>
</div>
<div class="card-info">
<h3>Total Estoque</h3>
<span id="estoqueTotal">0</span>
</div>
</div>
<div class="grafico">
<canvas id="graficoEstoque"></canvas>
</div>
</div>
<div id="estoque" class="secao">
<div class="card">
<h2> Novo Item</h2>
9
<div class="grid">
<input id="item" placeholder="Nome do item">
<input id="quantidade" type="number" placeholder="Quantidade">
<input id="minimo" type="number" placeholder="Mínimo">
<button class="btn" onclick="cadastrar()">Cadastrar</button>
</div>
</div>
<div class="table-container">
<table>
<thead>
<tr>
<th>Item</th>
<th>Quantidade</th>
<th>Mínimo</th>
<th>Status</th>
<th>Ações</th>
</tr>
</thead>
<tbody id="tabela"></tbody>
</table>
</div>
</div>
<div id="alertas" class="secao">
<div class="card">
<h2>⚠ Alertas</h2>
<table>
<thead>
<tr>
<th>Item</th>
<th>Quantidade</th>
<th>Mínimo</th>
</tr>
</thead>
<tbody id="tabelaAlertas"></tbody>
</table>
</div>
</div>
</div>
</div>
<script>
const API_URL = "https://script.google.com/macros/s/AKfycbwDfc6az14wh1YF2qNmZW6NanRET487an62jUUctJgHd-OVoPRrbYhHL3TTaGn2TcLN/exec";
let grafico;
10
function mostrarSecao(secaoId){
const secoes = document.querySelectorAll('.secao');
secoes.forEach(secao=>{
secao.classList.remove('ativa');
});
document.getElementById(secaoId).classList.add('ativa');
}
async function carregar(){
const resposta = await fetch(API_URL);
const dados = await resposta.json();
const tabela = document.getElementById('tabela');
const tabelaAlertas = document.getElementById('tabelaAlertas');
tabela.innerHTML = '';
tabelaAlertas.innerHTML = '';
let totalItens = dados.length;
let itensAlerta = 0;
let totalEstoque = 0;
const nomes = [];
const quantidades = [];
dados.forEach(item=>{
const alerta = Number(item.quantidade) <= Number(item.minimo);
if(alerta){
itensAlerta++;
tabelaAlertas.innerHTML += `
<tr>
<td>${item.item}</td>
<td>${item.quantidade}</td>
<td>${item.minimo}</td>
</tr>
`;
}
totalEstoque += Number(item.quantidade);
nomes.push(item.item);
quantidades.push(item.quantidade);
11
tabela.innerHTML += `
<tr class="${alerta ? 'alerta' : ''}">
<td>${item.item}</td>
<td>${item.quantidade}</td>
<td>${item.minimo}</td>
<td>
<span class="${alerta ? 'status-alerta' : 'status-ok'}">
${alerta ? 'ALERTA' : 'OK'}
</span>
</td>
<td>
<div class="acoes">
<button class="entrada" onclick="movimentar('${item.item}','entrada')">+</
button>
<button class="saida" onclick="movimentar('${item.item}','saida')">-</button>
</div>
</td>
</tr>
`;
});
document.getElementById('totalItens').innerText = totalItens;
document.getElementById('itensAlerta').innerText = itensAlerta;
document.getElementById('estoqueTotal').innerText = totalEstoque;
gerarGrafico(nomes,quantidades);
}
function gerarGrafico(labels,data){
const ctx = document.getElementById('graficoEstoque');
if(grafico){
grafico.destroy();
}
grafico = new Chart(ctx,{
type:'bar',
data:{
labels:labels,
datasets:[{
label:'Quantidade',
data:data,
borderWidth:1
}]
}
});
12
}
async function cadastrar(){
const item = document.getElementById('item').value;
const quantidade = document.getElementById('quantidade').value;
const minimo = document.getElementById('minimo').value;
await fetch(API_URL,{
method:'POST',
body:JSON.stringify({
tipo:'cadastro',
item,
quantidade,
minimo
})
});
carregar();
}
async function movimentar(item,acao){
const quantidade = prompt('Quantidade:');
if(!quantidade) return;
await fetch(API_URL,{
method:'POST',
body:JSON.stringify({
tipo:'movimentacao',
item,
acao,
quantidade
})
});
carregar();
}
carregar();
</script>
</body>
</html>
